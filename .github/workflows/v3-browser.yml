name: Robot Domination V3 — Browser UX
on:
  push:
    branches:
      - prototype/robot-domination-v3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le navigateur de validation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester visuellement et fonctionnellement la V3
        run: node tests/v3-browser.mjs
      - name: Publier les captures desktop et mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-domination-v3-captures
          path: artifacts/*.png
          if-no-files-found: ignore
